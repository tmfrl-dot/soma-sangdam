<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="소마 상담">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" href="favicon.png?v=2">
<title>소마 상담 스케줄표</title>
<style>
:root{
  --bg:#f3f3f0; --card:#fff; --ink:#151515; --sub:#75756f; --line:#e6e5e0;
  --brand:#151515; --brand2:#ee7d12; --acc-ink:#c2620a; --soft:#fff0dc; --gray:#f2f2ee;
  --green:#3aa845; --lav:#a596dc;
  --r-wait:#9a9a93; --r-ok:#2f9e44; --r-hold:#8672d2; --r-no:#d9534f;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
[hidden]{display:none!important}

/* 로그인 */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-box{position:relative;overflow:hidden;width:100%;max-width:340px;background:var(--card);border-radius:20px;padding:36px 24px 30px;box-shadow:0 10px 30px rgba(0,0,0,.07);text-align:center}
.login-box::before,header::after{content:"";position:absolute;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--green) 0 34%,var(--brand2) 34% 67%,var(--lav) 67%)}
.login-box::before{top:0;height:6px}
header::after{bottom:-4px}
.login-box h1{font-size:23px;font-weight:900;margin:0 0 4px;letter-spacing:-.6px}
.login-box p{margin:0 0 20px;color:var(--sub);font-size:13.5px}
.login-box input{width:100%;height:50px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;font-size:17px;text-align:center;letter-spacing:3px;outline:none}
.login-box input:focus{border-color:var(--brand2)}
.login-box button{width:100%;height:50px;margin-top:10px;border:0;border-radius:12px;background:var(--brand);color:#fff;font-weight:700;font-size:16px}
.login-box button:disabled{opacity:.6}
.err{color:var(--r-no);font-size:13.5px;min-height:20px;margin-top:10px}
.demo-hint{margin-top:14px;font-size:12.5px;color:#7a4a10;background:var(--soft);border-radius:10px;padding:8px 10px}

/* 상단 */
header{position:sticky;top:0;z-index:5;background:#fff;color:var(--ink);padding:12px 16px calc(12px);padding-top:calc(12px + env(safe-area-inset-top))}
.hrow{display:flex;align-items:center;gap:10px;max-width:1500px;margin:0 auto;flex-wrap:wrap}
.title{font-size:19px;font-weight:900;letter-spacing:-.6px;margin-right:auto}
.title small{font-weight:500;font-size:12px;color:var(--sub);margin-left:8px;letter-spacing:0}
.nav{display:flex;align-items:center;gap:6px}
.nav button{height:36px;min-width:36px;padding:0 10px;border:0;border-radius:10px;background:var(--gray);color:var(--ink);font-weight:700}
.nav button:active{background:#e2e2dc}
.range{font-weight:700;font-size:15px;min-width:118px;text-align:center}
.ghost{height:36px;padding:0 10px;border:0;border-radius:10px;background:transparent;color:var(--sub);font-size:13px}
.sync{font-size:12px;color:var(--sub)}

main{max-width:1500px;margin:0 auto;padding:18px 16px 60px}
.demo-bar{background:#fff3cd;color:#6b5200;border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:12px}

/* PC 주간 표 */
.week-title{display:flex;align-items:baseline;gap:10px;margin:6px 2px 8px}
.week-title b{font-size:16px}
.week-title span{color:var(--sub);font-size:13px}
.week{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:22px}
.col{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-height:180px}
.col-head{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:var(--gray);font-weight:800;font-size:14px}
.col-head em{font-style:normal;font-weight:600;font-size:12px;color:var(--sub)}
.col.today .col-head{background:var(--brand2);color:#fff}
.col.today .col-head em{color:#fff;opacity:.85}
.col.past{opacity:.72}
.col-body{padding:8px;display:flex;flex-direction:column;gap:7px;flex:1}

/* 상담 카드 */
.item{position:relative;text-align:left;width:100%;background:#fff;border:1px solid var(--line);border-left:4px solid var(--r-wait);border-radius:10px;padding:8px 10px;display:block}
.item:hover{border-color:#cfcec7;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.item[data-r="등록"]{border-left-color:var(--r-ok)}
.item[data-r="보류"]{border-left-color:var(--r-hold)}
.item[data-r="미등록"]{border-left-color:var(--r-no)}
.i-top{display:flex;align-items:center;gap:7px}
.i-time{font-weight:900;font-variant-numeric:tabular-nums;color:var(--ink)}
.i-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.badge{flex:none;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:999px;background:#efefeb;color:#77776f}
.badge[data-r="등록"]{background:#e2f4e4;color:#23803a}
.badge[data-r="보류"]{background:#ece8fa;color:#6450b5}
.badge[data-r="미등록"]{background:#fbe6e4;color:#c4453c}
.i-sub{font-size:13px;color:var(--sub);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.i-tel{display:inline-block;font-size:13px;color:var(--acc-ink);text-decoration:none;font-variant-numeric:tabular-nums;margin-top:2px}
.i-note{font-size:12.5px;color:#55554f;background:#f6f6f2;border-radius:6px;padding:4px 7px;margin-top:5px;white-space:pre-wrap;word-break:break-word}
.add{width:100%;border:1.5px dashed #d2d1ca;background:transparent;border-radius:10px;padding:8px;color:var(--sub);font-size:13.5px;font-weight:600}
.add:hover{border-color:var(--brand2);color:var(--acc-ink);background:var(--soft)}
.full{font-size:12px;color:var(--sub);text-align:center;padding:4px}

/* 폰 화면 */
.chips{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:14px}
.chip{border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 0 6px;text-align:center}
.chip .d{font-size:12px;color:var(--sub)}
.chip .n{font-size:17px;font-weight:800;line-height:1.2}
.chip .c{font-size:11px;color:var(--brand2);font-weight:700;min-height:15px}
.chip.today{border-color:var(--brand2)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip.on .d,.chip.on .c{color:#fff;opacity:.85}
.day-title{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 10px}
.day-title b{font-size:18px}
.day-title span{font-size:13px;color:var(--sub)}
.list{display:flex;flex-direction:column;gap:9px}
.list .item{padding:12px 14px;border-radius:12px}
.list .i-time{font-size:17px}
.list .i-name{font-size:17px}
.list .i-sub,.list .i-tel{font-size:14.5px}
.list .i-tel{padding:4px 0}
.list .i-note{font-size:14px}
.empty{background:#fff;border:1px dashed #c9cedb;border-radius:12px;padding:26px 10px;text-align:center;color:var(--sub)}
.fab{position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));height:52px;border:0;border-radius:14px;background:var(--brand2);color:#fff;font-weight:800;font-size:16px;box-shadow:0 8px 20px rgba(61,91,176,.35)}
.fab:disabled{background:#aab1c4;box-shadow:none}

/* 월간 달력 + 하루 타임라인 */
.vt{display:none;background:var(--gray);border-radius:10px;padding:3px}
.vt button{height:30px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:var(--sub);font-weight:700;font-size:13.5px}
.vt button.on{background:var(--brand);color:#fff}
@media(min-width:900px){.vt{display:flex}}
.mwrap{display:grid;gap:14px}
@media(min-width:900px){.mwrap{grid-template-columns:minmax(400px,480px) 1fr;align-items:start;gap:18px}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.p-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.p-head b{font-size:19px;font-weight:900;letter-spacing:-.5px}
.p-head .tot{font-size:14px;font-weight:800;color:var(--acc-ink)}
.stats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.stats .badge{font-size:12.5px;padding:3px 9px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-w{text-align:center;font-size:12px;color:var(--sub);padding:2px 0 4px;font-weight:600}
.cal-d{min-height:52px;border:1.5px solid transparent;border-radius:12px;background:#f6f6f2;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px 0}
.cal-d .num{font-weight:700;font-size:15px;line-height:1.25}
.cal-d .cnt{font-size:11.5px;font-weight:800;color:var(--acc-ink);min-height:15px;line-height:1.2}
.cal-d.has{background:var(--soft)}
.cal-d.today{border-color:var(--green)}
.cal-d.on{background:var(--brand);color:#fff}
.cal-d.on .cnt{color:#ffc27a}
.cal-d.sun{background:transparent;color:#c9c8c1}
.btn-add{height:36px;padding:0 12px;border:0;border-radius:10px;background:var(--brand2);color:#fff;font-weight:700;font-size:13.5px;flex:none}
.btn-add:disabled{background:#c4c3bc}
.tl-row{display:grid;grid-template-columns:64px minmax(0,1fr);border-top:1px solid var(--line);min-height:48px}
.tl-h{font-size:12.5px;color:var(--sub);padding:9px 0;font-weight:600}
.tl-row.now .tl-h{color:var(--green);font-weight:800}
.tl-row.busy{background:linear-gradient(90deg,transparent 58px,#fbfaf6 58px)}
.tl-c{padding:6px 0;display:flex;flex-direction:column;gap:6px;min-width:0}
.tl-c .i-time,.tl-c .i-name{font-size:16px}
.tl-c .i-sub,.tl-c .i-tel{font-size:14px}
.tl-add{width:100%;flex:1;min-height:34px;border:0;background:transparent;color:#cfcec7;border-radius:8px;text-align:left;padding:0 10px;font-size:15px}
.tl-add:hover,.tl-add:active{background:var(--soft);color:var(--acc-ink)}

/* 입력 창 */
dialog{border:0;border-radius:20px;padding:0;width:min(460px,calc(100vw - 24px));max-height:calc(100vh - 24px);box-shadow:0 20px 50px rgba(0,0,0,.25);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.frm{padding:20px}
.frm h2{margin:0 0 14px;font-size:20px;font-weight:900;letter-spacing:-.5px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:12.5px;font-weight:700;color:var(--sub);margin-bottom:10px}
label input,label textarea{display:block;width:100%;margin-top:4px;border:1.5px solid var(--line);border-radius:10px;padding:10px 11px;font-size:16px;font-weight:400;color:var(--ink);background:#fff;outline:none}
label input:focus,label textarea:focus{border-color:var(--brand2)}
textarea{resize:vertical;min-height:64px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:4px 0 4px}
.seg button{height:42px;border:1.5px solid var(--line);background:#fff;border-radius:10px;font-weight:700;font-size:14.5px;color:var(--sub)}
.seg button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.seg button.on[data-r="등록"]{background:var(--r-ok);border-color:var(--r-ok)}
.seg button.on[data-r="보류"]{background:var(--r-hold);border-color:var(--r-hold)}
.seg button.on[data-r="미등록"]{background:var(--r-no);border-color:var(--r-no)}
.acts{display:flex;gap:8px;margin-top:14px}
.acts button{height:48px;border-radius:12px;border:0;font-weight:700;padding:0 16px}
.b-del{background:#fbe6e4;color:#c4453c}
.b-cancel{background:var(--gray);margin-left:auto}
.b-save{background:var(--brand);color:#fff;min-width:96px}
.acts button:disabled{opacity:.6}

.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#151515;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:20;max-width:90vw}
</style>
</head>
<body>

<div id="login">
  <div class="login-box" id="loginForm">
    <h1>소마 상담 스케줄표</h1>
    <p>접속 비밀번호를 입력해 주세요</p>
    <input id="pw" type="password" inputmode="text" autocomplete="current-password" placeholder="비밀번호" required>
    <button id="loginBtn" type="button">들어가기</button>
    <div class="err" id="loginErr"></div>
    <div class="demo-hint" id="demoHint" hidden>미리보기 모드입니다 · 비밀번호 <b>1234</b></div>
  </div>
</div>

<div id="app" hidden>
  <header>
    <div class="hrow">
      <div class="title">소마 상담 스케줄표<small>월–토 · 하루 최대 5건</small></div>
      <span class="sync" id="sync"></span>
      <div class="vt" id="vt"><button data-view="month">월간</button><button data-view="week">2주 표</button></div>
      <div class="nav">
        <button data-nav="-1" aria-label="이전">‹</button>
        <span class="range" id="range"></span>
        <button data-nav="1" aria-label="다음">›</button>
        <button data-nav="0">오늘</button>
      </div>
      <button class="ghost" id="logout">나가기</button>
    </div>
  </header>
  <main id="board"></main>
</div>

<dialog id="dlg">
  <div class="frm" id="form">
    <h2 id="formTitle">상담 추가</h2>
    <div class="g2">
      <label>날짜<input id="f_date" type="date" required></label>
      <label>시간<input id="f_time" type="time" step="600" required></label>
    </div>
    <div class="g2">
      <label>이름<input id="f_name" type="text" maxlength="30" required></label>
      <label>연령<input id="f_age" type="text" maxlength="20" placeholder="예: 7세, 초2"></label>
    </div>
    <div class="g2">
      <label>소속<input id="f_school" type="text" maxlength="40" placeholder="유치원·학교"></label>
      <label>전화번호<input id="f_phone" type="tel" maxlength="20" placeholder="010-0000-0000"></label>
    </div>
    <label>비고<textarea id="f_note" maxlength="500"></textarea></label>
    <label style="margin-bottom:0">상담 결과</label>
    <div class="seg" id="seg">
      <button type="button" data-r="예정">예정</button>
      <button type="button" data-r="등록">등록</button>
      <button type="button" data-r="보류">보류</button>
      <button type="button" data-r="미등록">미등록</button>
    </div>
    <div class="err" id="formErr"></div>
    <div class="acts">
      <button type="button" class="b-del" id="delBtn">삭제</button>
      <button type="button" class="b-cancel" id="cancelBtn">취소</button>
      <button type="button" class="b-save" id="saveBtn">저장</button>
    </div>
  </div>
</dialog>

<script>
/* ───────── 설정 ─────────
   설치할 때 구글 Apps Script 웹앱 주소를 아래 따옴표 안에 붙여 넣습니다.
   비워 두면 미리보기 모드(비밀번호 1234, 저장 안 됨)로 동작합니다. */
const API_URL = "https://script.google.com/macros/s/AKfycbyeC3Dod0sX0dQEJwON8l7xlCxrYUKnToudTdbYsiKPga31E2tCC_z_E8GMM4qMKtRnYA/exec";

const MAX_PER_DAY = 5;
const DOW = ['일','월','화','수','목','금','토'];
const $ = id => document.getElementById(id);
const wide = window.matchMedia('(min-width: 900px)');

const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseYmd = s => { const a = s.split('-').map(Number); return new Date(a[0], a[1]-1, a[2]); };
const addDays = (d,n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate()+n); return x; };
const monday = d => addDays(d, -((d.getDay()+6)%7));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function firstWorkday(){ const t = new Date(); return t.getDay() === 0 ? addDays(t,1) : addDays(t,0); }

const state = { pw:'', anchor: monday(firstWorkday()), sel: ymd(firstWorkday()), items: [], view: 'month', month: new Date(firstWorkday().getFullYear(), firstWorkday().getMonth(), 1), editing: null, result: '예정', busy: false };

/* ───────── 저장소 연결 ───────── */
function sampleData(){
  const m = monday(firstWorkday()), t = ymd(firstWorkday());
  const mk = (i, off, time, name, age, school, note, result) =>
    ({ id:'demo'+i, date: off === null ? t : ymd(addDays(m, off)), time, name, age, school, phone:'010-0000-000'+i, note, result });
  return [
    mk(1, null, '14:00', '예시 김하준', '7세', '○○유치원', '형이 재원 중', '예정'),
    mk(2, null, '16:30', '예시 이서아', '초1', '○○초등학교', '', '예정'),
    mk(3, 0, '15:00', '예시 박도윤', '6세', '○○어린이집', '레벨테스트 희망', '등록'),
    mk(4, 2, '17:00', '예시 최지우', '초2', '○○초등학교', '시간대 조율 필요', '보류'),
    mk(5, 4, '11:00', '예시 정시우', '7세', '○○유치원', '', '미등록'),
    mk(6, 8, '15:30', '예시 한유나', '초1', '○○초등학교', '', '예정')
  ];
}
let demo = null;
function demoApi(action, p){
  if (p.pw !== '1234') throw new Error('AUTH');
  if (!demo) demo = sampleData();
  if (action === 'login') return { ok:true };
  if (action === 'list') return { ok:true, items: demo.filter(x => x.date >= p.from && x.date <= p.to).map(x => Object.assign({}, x)) };
  if (action === 'save') {
    const it = Object.assign({}, p.item);
    if (demo.filter(x => x.date === it.date && x.id !== it.id).length >= MAX_PER_DAY) throw new Error('FULL');
    const i = demo.findIndex(x => x.id === it.id);
    if (i >= 0) demo[i] = it; else { it.id = 'demo' + Date.now(); demo.push(it); }
    return { ok:true };
  }
  if (action === 'delete') { demo = demo.filter(x => x.id !== p.id); return { ok:true }; }
  throw new Error('UNKNOWN');
}
async function api(action, payload){
  const body = Object.assign({ pw: state.pw, action }, payload || {});
  if (!API_URL) return demoApi(action, body);
  const res = await fetch(API_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'ERROR');
  return j;
}
function message(e){
  const m = e && e.message;
  if (m === 'AUTH') return '비밀번호가 맞지 않습니다.';
  if (m === 'LOCKED') return '비밀번호를 여러 번 틀려 잠시 잠겼습니다. 10분 뒤 다시 시도해 주세요.';
  if (m === 'FULL') return '그날은 이미 ' + MAX_PER_DAY + '건이 찼습니다.';
  return '연결에 문제가 있습니다. 잠시 후 다시 시도해 주세요.';
}

/* ───────── 로그인 ───────── */
function remember(pw){ try { pw ? localStorage.setItem('soma_pw', pw) : localStorage.removeItem('soma_pw'); } catch(e){} }
function recall(){ try { return localStorage.getItem('soma_pw') || ''; } catch(e){ return ''; } }

async function login(pw, silent){
  state.pw = pw;
  $('loginBtn').disabled = true;
  try {
    await api('login');
    remember(pw);
    $('login').hidden = true; $('app').hidden = false;
    await load();
    startPolling();
  } catch(e){
    state.pw = '';
    if (e.message === 'AUTH') remember('');
    if (!silent || e.message !== 'AUTH') $('loginErr').textContent = message(e);
  } finally { $('loginBtn').disabled = false; }
}
function logout(){
  remember(''); state.pw = ''; state.items = [];
  stopPolling();
  $('app').hidden = true; $('login').hidden = false; $('pw').value = ''; $('loginErr').textContent = '';
}
function tryLogin(){ const v = $('pw').value.trim(); $('loginErr').textContent = ''; if (!v) { $('loginErr').textContent = '비밀번호를 입력해 주세요.'; return; } login(v, false); }
$('loginBtn').addEventListener('click', tryLogin);
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); tryLogin(); } });
$('logout').addEventListener('click', logout);

/* ───────── 불러오기 ───────── */
async function load(){
  if (!state.pw) return;
  try {
    const ms = addDays(state.month, -7), me = addDays(new Date(state.month.getFullYear(), state.month.getMonth()+1, 0), 7);
    const ws = addDays(state.anchor, -7), we = addDays(state.anchor, 20);
    const r = await api('list', { from: ymd(ms < ws ? ms : ws), to: ymd(me > we ? me : we) });
    state.items = r.items || [];
    const n = new Date();
    $('sync').textContent = pad(n.getHours()) + ':' + pad(n.getMinutes()) + ' 동기화';
    render();
  } catch(e){
    if (e.message === 'AUTH') { logout(); $('loginErr').textContent = '비밀번호가 변경되었습니다. 다시 입력해 주세요.'; }
    else $('sync').textContent = '연결 끊김';
  }
}
let timer = null;
function startPolling(){ stopPolling(); timer = setInterval(() => { if (!document.hidden && !state.busy) load(); }, 20000); }
function stopPolling(){ if (timer) clearInterval(timer); timer = null; }
document.addEventListener('visibilitychange', () => { if (!document.hidden && state.pw) load(); });

/* ───────── 화면 그리기 ───────── */
const byDate = d => state.items.filter(x => x.date === d).sort((a,b) => (a.time||'').localeCompare(b.time||''));

function cardHtml(x){
  const r = x.result || '예정';
  const sub = [x.age, x.school].filter(Boolean).map(esc).join(' · ');
  const tel = String(x.phone || '').replace(/[^0-9+]/g,'');
  return '<div class="item" role="button" tabindex="0" data-act="edit" data-id="' + esc(x.id) + '" data-r="' + esc(r) + '">' +
    '<div class="i-top"><span class="i-time">' + esc(x.time) + '</span><span class="i-name">' + esc(x.name) + '</span>' +
    '<span class="badge" data-r="' + esc(r) + '">' + esc(r) + '</span></div>' +
    (sub ? '<div class="i-sub">' + sub + '</div>' : '') +
    (x.phone ? '<a class="i-tel" href="tel:' + esc(tel) + '">' + esc(x.phone) + '</a>' : '') +
    (x.note ? '<div class="i-note">' + esc(x.note) + '</div>' : '') +
  '</div>';
}

function summary(list){
  const c = { '예정':0, '등록':0, '보류':0, '미등록':0 };
  list.forEach(x => { const r = x.result || '예정'; if (c[r] != null) c[r]++; });
  return c;
}
function statsHtml(c){
  return '<div class="stats">' + ['등록','보류','미등록','예정'].map(r => '<span class="badge" data-r="' + r + '">' + r + ' ' + c[r] + '</span>').join('') + '</div>';
}
const hourLabel = h => (h < 12 ? '오전 ' + h : '오후 ' + (h === 12 ? 12 : h - 12)) + '시';

function weekHtml(today){
  const a = state.anchor, end = addDays(a, 12);
  $('range').textContent = (a.getMonth()+1) + '/' + a.getDate() + ' – ' + (end.getMonth()+1) + '/' + end.getDate();
  let html = '';
  for (let w = 0; w < 2; w++) {
    const ws = addDays(a, w*7), we = addDays(ws, 5);
    let total = 0, cols = '';
    for (let i = 0; i < 6; i++) {
      const d = addDays(ws, i), key = ymd(d), list = byDate(key);
      total += list.length;
      cols += '<div class="col' + (key === today ? ' today' : key < today ? ' past' : '') + '">' +
        '<div class="col-head"><span>' + (d.getMonth()+1) + '월 ' + d.getDate() + '일 (' + DOW[d.getDay()] + ')</span><em>' + list.length + '/' + MAX_PER_DAY + '</em></div>' +
        '<div class="col-body">' + list.map(cardHtml).join('') +
        (list.length < MAX_PER_DAY ? '<button class="add" data-act="add" data-date="' + key + '">+ 상담 추가</button>' : '<div class="full">' + MAX_PER_DAY + '건 마감</div>') +
        '</div></div>';
    }
    html += '<div class="week-title"><b>' + (w+1) + '주차</b><span>' + (ws.getMonth()+1) + '월 ' + ws.getDate() + '일 – ' + (we.getMonth()+1) + '월 ' + we.getDate() + '일 · ' + total + '건</span></div><div class="week">' + cols + '</div>';
  }
  return html;
}

function monthHtml(today){
  const y = state.month.getFullYear(), mo = state.month.getMonth();
  const first = new Date(y, mo, 1), days = new Date(y, mo+1, 0).getDate(), mk = ymd(first).slice(0,7);
  $('range').textContent = y + '년 ' + (mo+1) + '월';
  if (state.sel.slice(0,7) !== mk) {
    let d = today.slice(0,7) === mk ? parseYmd(today) : first;
    if (d.getDay() === 0) d = addDays(d, 1);
    if (ymd(d).slice(0,7) !== mk) d = addDays(d, -2);
    state.sel = ymd(d);
  }
  const monthItems = state.items.filter(x => x.date.slice(0,7) === mk);

  let cells = DOW.map(w => '<div class="cal-w">' + w + '</div>').join('');
  for (let i = 0; i < first.getDay(); i++) cells += '<div></div>';
  for (let d = 1; d <= days; d++) {
    const dt = new Date(y, mo, d), key = ymd(dt);
    if (dt.getDay() === 0) { cells += '<div class="cal-d sun"><span class="num">' + d + '</span><span class="cnt"></span></div>'; continue; }
    const n = byDate(key).length;
    cells += '<button class="cal-d' + (n ? ' has' : '') + (key === today ? ' today' : '') + (key === state.sel ? ' on' : '') + '" data-act="day" data-date="' + key + '">' +
      '<span class="num">' + d + '</span><span class="cnt">' + (n ? n + '건' : '') + '</span></button>';
  }

  const sd = parseYmd(state.sel), list = byDate(state.sel), full = list.length >= MAX_PER_DAY;
  const hourOf = x => parseInt(String(x.time || '0').slice(0,2), 10) || 0;
  const nowH = new Date().getHours();
  const row = (label, its, h) =>
    '<div class="tl-row' + (its.length ? ' busy' : '') + (h === nowH && state.sel === today ? ' now' : '') + '"><div class="tl-h">' + label + '</div><div class="tl-c">' +
    (its.length ? its.map(cardHtml).join('') : (full || h == null ? '' : '<button class="tl-add" data-act="add" data-date="' + state.sel + '" data-time="' + pad(h) + ':00" aria-label="' + label + ' 상담 추가">+</button>')) +
    '</div></div>';
  let tl = '';
  const early = list.filter(x => hourOf(x) < 9), late = list.filter(x => hourOf(x) > 20);
  if (early.length) tl += row('9시 이전', early, null);
  for (let h = 9; h <= 20; h++) tl += row(hourLabel(h), list.filter(x => hourOf(x) === h), h);
  if (late.length) tl += row('8시 이후', late, null);

  return '<div class="mwrap">' +
    '<section class="panel"><div class="p-head"><b>' + (mo+1) + '월 상담</b><span class="tot">총 ' + monthItems.length + '건</span></div>' +
      statsHtml(summary(monthItems)) + '<div class="cal">' + cells + '</div></section>' +
    '<section class="panel" id="dayPanel"><div class="p-head"><div><b>' + (sd.getMonth()+1) + '월 ' + sd.getDate() + '일 (' + DOW[sd.getDay()] + ')' + (state.sel === today ? ' · 오늘' : '') + '</b> ' +
      '<span class="tot">상담 ' + list.length + '건</span></div>' +
      '<button class="btn-add" data-act="add" data-date="' + state.sel + '"' + (full ? ' disabled' : '') + '>' + (full ? MAX_PER_DAY + '건 마감' : '+ 상담 추가') + '</button></div>' +
      statsHtml(summary(list)) + tl + '</section>' +
  '</div>';
}

const curView = () => wide.matches ? state.view : 'month';
function render(){
  const today = ymd(new Date()), v = curView();
  $('vt').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.view === v));
  const demoBar = API_URL ? '' : '<div class="demo-bar">미리보기 모드입니다. 입력한 내용은 저장되지 않으며, 설치 후 실제 데이터와 연결됩니다.</div>';
  $('board').innerHTML = demoBar + (v === 'week' ? weekHtml(today) : monthHtml(today));
}
$('vt').addEventListener('click', e => { const b = e.target.closest('[data-view]'); if (!b) return; state.view = b.dataset.view; render(); load(); });
wide.addEventListener('change', render);

$('board').addEventListener('click', e => {
  if (e.target.closest('.i-tel')) return;
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  if (act === 'day') { state.sel = el.dataset.date; render(); }
  if (act === 'add') openForm({ date: el.dataset.date, time: el.dataset.time || '' });
  if (act === 'edit') { const it = state.items.find(x => x.id === el.dataset.id); if (it) openForm(it); }
});
$('board').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('.item')) e.target.click(); });

document.querySelector('.nav').addEventListener('click', e => {
  const b = e.target.closest('[data-nav]'); if (!b) return;
  const n = Number(b.dataset.nav);
  const t = firstWorkday();
  if (n === 0) { state.anchor = monday(t); state.sel = ymd(t); state.month = new Date(t.getFullYear(), t.getMonth(), 1); }
  else if (curView() === 'week') state.anchor = addDays(state.anchor, n*7);
  else state.month = new Date(state.month.getFullYear(), state.month.getMonth()+n, 1);
  render(); load();
});

/* ───────── 입력 창 ───────── */
function setResult(r){ state.result = r; $('seg').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.r === r)); }
$('seg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setResult(b.dataset.r); });

function openForm(it){
  state.editing = it.id || null;
  $('formTitle').textContent = it.id ? '상담 수정' : '상담 추가';
  $('f_date').value = it.date || state.sel;
  $('f_time').value = it.time || '';
  $('f_name').value = it.name || '';
  $('f_age').value = it.age || '';
  $('f_school').value = it.school || '';
  $('f_phone').value = it.phone || '';
  $('f_note').value = it.note || '';
  setResult(it.result || '예정');
  $('formErr').textContent = '';
  $('delBtn').hidden = !it.id; $('delBtn').textContent = '삭제'; $('delBtn').dataset.armed = '';
  $('dlg').showModal();
}
$('cancelBtn').addEventListener('click', () => $('dlg').close());

$('saveBtn').addEventListener('click', async () => {
  const item = {
    id: state.editing || '', date: $('f_date').value, time: $('f_time').value, name: $('f_name').value.trim(),
    age: $('f_age').value.trim(), school: $('f_school').value.trim(), phone: $('f_phone').value.trim(),
    note: $('f_note').value.trim(), result: state.result
  };
  if (!item.date || !item.time || !item.name) { $('formErr').textContent = '날짜, 시간, 이름은 꼭 입력해 주세요.'; return; }
  if (parseYmd(item.date).getDay() === 0) { $('formErr').textContent = '일요일은 상담 일정이 없습니다. 월–토 중에서 골라 주세요.'; return; }
  await run(() => api('save', { item }), '저장했습니다');
});

$('delBtn').addEventListener('click', async () => {
  const b = $('delBtn');
  if (!b.dataset.armed) { b.dataset.armed = '1'; b.textContent = '정말 삭제'; return; }
  await run(() => api('delete', { id: state.editing }), '삭제했습니다');
});

async function run(fn, done){
  state.busy = true; $('saveBtn').disabled = true; $('delBtn').disabled = true; $('formErr').textContent = '';
  try { await fn(); $('dlg').close(); toast(done); await load(); }
  catch(e){ if (e.message === 'AUTH') { $('dlg').close(); logout(); } else $('formErr').textContent = message(e); }
  finally { state.busy = false; $('saveBtn').disabled = false; $('delBtn').disabled = false; }
}

let toastEl = null;
function toast(t){
  if (toastEl) toastEl.remove();
  toastEl = document.createElement('div'); toastEl.className = 'toast'; toastEl.textContent = t;
  document.body.appendChild(toastEl);
  const me = toastEl; setTimeout(() => me.remove(), 1800);
}

/* ───────── 시작 ───────── */
if (!API_URL) $('demoHint').hidden = false;
const saved = recall();
if (saved) login(saved, true);
</script>
</body>
</html>
